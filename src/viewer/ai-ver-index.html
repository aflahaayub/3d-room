<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background: #72645b; }
    </style>
</head>
<body>

    <!-- Load three.js from a CDN. No npm install needed. -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from "three";
        import Stats from "three/addons/libs/stats.module.js";
        import { PLYLoader } from "three/addons/loaders/PLYLoader.js";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";

        let container, camera, scene, renderer, stats, controls;

        init();

        function init() {
            container = document.createElement("div");
            document.body.appendChild(container);

            // Camera sits at the origin, where the photo's camera was.
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
            camera.position.set(0, 0, 0.01);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x72645b);

            // renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // mouse controls: left-drag rotate, right-drag pan, wheel zoom
            controls = new OrbitControls(camera, renderer.domElement);

            // Load the point cloud. Path is relative to this page,
            // so serve from the src/ folder: python -m http.server 8000
            const loader = new PLYLoader();
            loader.load("../3d_room_ai/room-ikea.ply", geometry => {
                // The file has colours but no faces, so draw it as points.
                const material = new THREE.PointsMaterial({ size: 0.01, vertexColors: true });
                const points = new THREE.Points(geometry, material);

                // depth.py uses the image convention: y points down, z points forward.
                // three.js uses y up and the camera looks along -z.
                // Rotating 180 degrees around x flips both, so the room looks like the photo.
                points.rotation.x = Math.PI;
                scene.add(points);

                // Orbit around the centre of the cloud.
                geometry.computeBoundingBox();
                const center = new THREE.Vector3();
                geometry.boundingBox.getCenter(center);
                points.localToWorld(center);
                controls.target.copy(center);
                controls.update();
            });

            // stats (FPS counter, top left)
            stats = new Stats();
            container.appendChild(stats.dom);

            window.addEventListener("resize", onWindowResize);

            renderer.setAnimationLoop(animate);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            controls.update();
            renderer.render(scene, camera);
            stats.update();
        }
    </script>

</body>
</html>
