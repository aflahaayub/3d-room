<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background: #72645b; }
    </style>
</head>
<body>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from "three";
        import Stats from "three/addons/libs/stats.module.js";
        import {PLYLoader} from "three/addons/loaders/PLYLoader.js"
        import {OrbitControls} from "three/addons/controls/OrbitControls.js";

        let renderer, camera, scene, stats, controls
        init()

        function init(){
            let container = document.createElement("div");
            document.body.appendChild(container)

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
            camera.position.set(0, 0, 0.01);

            scene = new THREE.Scene();
            scene.background = new THREE.Color( 0x000000 );

            renderer = new THREE.WebGLRenderer({antialias: true})
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight)

            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);

            const loader = new PLYLoader();

            loader.load("../3d_room_ai/room-ikea.ply", geometry=>{

                const material = new THREE.PointsMaterial({ size: 0.03, vertexColors: true })

                const points = new THREE.Points( geometry, material );

                points.rotation.x = Math.PI ;

                scene.add( points );

                // what is this????
                geometry.computeBoundingBox();
                const center = new THREE.Vector3();
                geometry.boundingBox.getCenter(center);
                points.localToWorld(center);
                controls.target.copy(center);
                controls.update();
            })

            renderer.setAnimationLoop( animate );

            // stats

            stats = new Stats();
            container.appendChild( stats.dom );

            // resize

            window.addEventListener( 'resize', onWindowResize );

        }


        function onWindowResize() {

            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();

            renderer.setSize( window.innerWidth, window.innerHeight );
        }

        function animate () {
            controls.update()
            renderer.render(scene, camera)
            stats.update()

        }



    </script>
    
</body>
</html>
